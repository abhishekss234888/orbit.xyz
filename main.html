<style>

  --t-tap:120ms;--t-hover:140ms;--t-sheet-in:320ms;--t-sheet-out:220ms;--t-msg:220ms;--t-route-out:100ms;--t-route-in:140ms;--t-dots:1200ms;

.toast{pointer-events:auto;max-width:min(92vw,420px);padding:10px var(--sp-4);background:var(--surface-hover);border:1px solid var(--border-strong);border-radius:var(--r-2);box-shadow:var(--shadow-2);animation:toast-in 220ms var(--ease-out)}

.skel{position:relative;overflow:hidden;background:var(--skeleton-base);border-radius:var(--r-2);height:56px}

@keyframes shimmer{to{transform:translateX(100%)}}
.badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:var(--r-pill);background:var(--accent);color:var(--text-inverse);font:600 .6875rem var(--font-ui)}

}

}

<body>
<div id="app">
  <main id="view" tabindex="-1"><div class="splash"><i></i></div></main>
  <div id="sheets"></div>
</div>
<div id="toasts" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Orbit needs JavaScript to run.</p></noscript>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, sendEmailVerification, deleteUser } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, memoryLocalCache, doc, getDoc, runTransaction, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import { getDatabase, ref, onValue, set as rset, push, remove, onDisconnect, serverTimestamp as rtsNow } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';

/* ── firebase ── */
// Public by design: security comes from rules + referrer restriction, not secrecy.
const firebaseConfig = {
  apiKey: 'YOUR_API_KEY',
  authDomain: 'YOUR_PROJECT_ID.firebaseapp.com',
  databaseURL: 'https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com',
  projectId: 'YOUR_PROJECT_ID',
  appId: 'YOUR_APP_ID'
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
setPersistence(auth, browserLocalPersistence).catch(() => {});

const canPersist = 'indexedDB' in globalThis;
const db = initializeFirestore(app, {
  localCache: canPersist
    ? persistentLocalCache({ tabManager: persistentMultipleTabManager() })
    : memoryLocalCache()
});

const rtdb = getDatabase(app);

/* ── utils ── */
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const isMobile = () => matchMedia('(max-width: 767px)').matches;

function debounce(fn, ms = 200) {
  let t;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  d.cancel = () => clearTimeout(t);
  return d;
}

function throttle(fn, ms = 500) {
  let last = 0, t;
  return (...a) => {
    const wait = ms - (Date.now() - last);
    clearTimeout(t);
    if (wait <= 0) { last = Date.now(); fn(...a); }
    else t = setTimeout(() => { last = Date.now(); fn(...a); }, wait);
  };
}

const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const escapeHtml = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);

// Normalises user text: strips control chars and bidi-override tricks, keeps ZWJ so emoji sequences survive.
function sanitizeText(s, max = 4000) {
  return String(s ?? '')
    .normalize('NFC')
    .replace(/\r\n?/g, '\n')
    .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\u200B\u200C\u200E\u200F\u202A-\u202E\u2066-\u2069]/g, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim()
    .slice(0, max);
}

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

const weekday = new Intl.DateTimeFormat(undefined, { weekday: 'short' });
const monthDay = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric' });
const full = new Intl.DateTimeFormat(undefined, { year: 'numeric', month: 'short', day: 'numeric' });

function timeAgo(ts, now = Date.now()) {
  const ms = ts?.toMillis?.() ?? (ts instanceof Date ? ts.getTime() : Number(ts));
  if (!ms) return '';
  const s = Math.max(0, (now - ms) / 1000), d = new Date(ms);
  if (s < 60) return 'now';
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h`;
  if (s < 172800) return 'Yesterday';
  if (s < 604800) return weekday.format(d);
  return (d.getFullYear() === new Date(now).getFullYear() ? monthDay : full).format(d);
}

/* ── state ── */
const defaults = () => ({
  user: null,            // Firebase user snapshot { uid, email, emailVerified }
  profile: null,         // /users/{uid} document data
  authReady: false,
  online: navigator.onLine,
  chats: { items: [], loaded: false, tab: 'direct', query: '' },
  chatIndex: {},         // chatId -> { unreadCount, muted, pinned, lastReadAt }
  blocked: {},           // targetUid -> true
  presence: {},          // uid -> { state, at }
  typing: {},            // chatId -> { uid: { typing, at } }
  activeChatId: null,
  settings: { theme: 'dark', fontScale: 1, notifications: true },
  ui: { sheet: null, toasts: [] }
});

let state = defaults();
const subs = new Set();

const read = (obj, keys) => keys.reduce((o, k) => (o == null ? undefined : o[k]), obj);
const assoc = (obj, keys, val) => {
  if (!keys.length) return val;
  const [k, ...rest] = keys;
  return { ...obj, [k]: assoc(obj?.[k], rest, val) };
};

const get = (path = '') => (path ? read(state, path.split('.')) : state);

function set(path, value) {
  const next = typeof value === 'function' ? value(get(path)) : value;
  if (Object.is(next, get(path))) return;
  state = assoc(state, path.split('.'), next);
  for (const s of [...subs]) {
    const cur = s.path ? read(state, s.keys) : state;
    if (!Object.is(cur, s.last)) { const prev = s.last; s.last = cur; s.fn(cur, prev); }
  }
}

function subscribe(path, fn, immediate = false) {
  const keys = path ? path.split('.') : [];
  const s = { path, keys, fn, last: path ? read(state, keys) : state };
  subs.add(s);
  if (immediate) fn(s.last, undefined);
  return () => subs.delete(s);
}

const reset = () => { state = defaults(); for (const s of subs) { s.last = s.path ? read(state, s.keys) : state; s.fn(s.last, undefined); } };

/* ── router ── */
const routes = [];
let outlet, sheets;
let base = { key: '', route: null };
let sheet = null, token = 0, idx = -1, replacing = false;

// route('/chats/:chatId', { guard, render, leave, onQuery, sheet })
// guard(ctx) -> falsy to allow, or a path string to redirect to.
// sheet: (params) => basePath. Marks the route as an overlay that renders into the sheet host
// and mounts its base view first on deep links. Register specific patterns before parametric ones.
function route(pattern, opts) {
  const keys = [];
  const src = pattern
    .replace(/\/:([A-Za-z]+)/g, (_, k) => (keys.push(k), '/([^/]+)'))
    .replace(/\/\*$/, '/.*');
  routes.push({ pattern, re: new RegExp(`^${src}/?$`), keys, ...opts });
}

function parse(hash = location.hash) {
  const [p, q = ''] = hash.replace(/^#/, '').split('?');
  return { path: '/' + p.replace(/^\/+|\/+$/g, ''), query: Object.fromEntries(new URLSearchParams(q)) };
}

function navigate(path, replace = false) {
  const h = '#' + path;
  if (location.hash === h) return resolve();
  if (replace) { replacing = true; location.replace(h); } else location.hash = h;
}

const back = (fallback = '/chats') => (idx > 0 ? history.back() : navigate(fallback, true));

function stamp() {
  if (history.state?.i == null) {
    if (!replacing) idx++;
    history.replaceState({ i: idx }, '');
  } else idx = history.state.i;
  replacing = false;
}

const fade = (from, to, ms) =>
  outlet.animate([{ opacity: from }, { opacity: to }], { duration: ms, easing: 'cubic-bezier(0.4,0,0.2,1)', fill: 'forwards' }).finished;

async function closeSheet() {
  if (!sheet) return;
  const s = sheet; sheet = null;
  await s.leave?.();
  sheets.replaceChildren();
}

async function mountBase(r, ctx, my) {
  const key = r.pattern + JSON.stringify(ctx.params);
  if (base.key === key) { r.onQuery?.(ctx); return; }
  if (base.route) {
    await fade(1, 0, 100);
    if (my !== token) return;
    await base.route.leave?.();
  }
  outlet.replaceChildren();
  base = { key, route: r };
  await r.render({ ...ctx, outlet });
  if (my === token) { await fade(0, 1, 140); outlet.getAnimations().forEach((a) => a.cancel()); }
}

async function resolve() {
  const my = ++token;
  stamp();
  const { path, query } = parse();
  const r = routes.find((x) => x.re.test(path));
  if (!r) return navigate('/404', true);
  const m = r.re.exec(path), params = {};
  r.keys.forEach((k, i) => (params[k] = decodeURIComponent(m[i + 1])));
  const ctx = { path, query, params };
  const to = await r.guard?.(ctx);
  if (my !== token) return;
  if (to) return navigate(to, true);
  if (r.sheet) {
    if (!base.route) {
      const bp = r.sheet(params), b = routes.find((x) => x.re.test(bp));
      if (b) await mountBase(b, { path: bp, query: {}, params: {} }, my);
      if (my !== token) return;
    }
    await closeSheet();
    if (my !== token) return;
    sheet = r;
    await r.render({ ...ctx, outlet: sheets });
    return;
  }
  await closeSheet();
  if (my !== token) return;
  await mountBase(r, ctx, my);
}

function start(outletEl, sheetHost) {
  outlet = outletEl; sheets = sheetHost;
  addEventListener('hashchange', resolve);
  resolve();
}

/* ── ui ── */
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

// Tiny hyperscript. Text always goes through textContent/createTextNode, never innerHTML.
function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  n.append(...kids.flat().filter((x) => x != null && x !== false));
  return n;
}

function toast(msg, kind = 'info', ms = 3200) {
  const host = document.getElementById('toasts');
  while (host.children.length >= 3) host.firstChild.remove();
  const t = el('div', { class: `toast toast--${kind}`, text: msg });
  host.append(t);
  setTimeout(() => {
    t.classList.add('is-out');
    t.addEventListener('animationend', () => t.remove(), { once: true });
  }, ms);
}

let current = null;

// Bottom sheet. Routes keep it alive via leaveSheet() as their `leave` hook.
function openSheet(host, { title, body, onClose }) {
  const prev = document.activeElement;
  const scrim = el('div', { class: 'scrim', onclick: () => onClose?.() });
  const panel = el('section', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title, tabindex: '-1' },
    el('div', { class: 'sheet__grab' }), el('h2', { class: 'sheet__title', text: title }), body);
  host.replaceChildren(scrim, panel);
  const rm = reduced(), out = { duration: 0, fill: 'forwards' };
  scrim.animate([{ opacity: 0 }, { opacity: 1 }], { duration: rm ? 120 : 320, easing: 'cubic-bezier(0.16,1,0.3,1)' });
  panel.animate(rm ? [{ opacity: 0 }, { opacity: 1 }] : [{ transform: 'translateY(100%)' }, { transform: 'none' }],
    { duration: rm ? 120 : 320, easing: 'cubic-bezier(0.16,1,0.3,1)' });
  panel.focus();
  const onKey = (e) => e.key === 'Escape' && onClose?.();
  addEventListener('keydown', onKey);
  const leave = async () => {
    removeEventListener('keydown', onKey);
    const o = { ...out, duration: rm ? 120 : 220, easing: 'cubic-bezier(0.4,0,1,1)' };
    await Promise.all([
      scrim.animate([{ opacity: 1 }, { opacity: 0 }], o).finished,
      panel.animate(rm ? [{ opacity: 1 }, { opacity: 0 }] : [{ transform: 'none' }, { transform: 'translateY(100%)' }], o).finished
    ]);
    prev?.focus?.();
  };
  current = { panel, leave };
  return current;
}

const leaveSheet = () => { const s = current; current = null; return s?.leave(); };

const skeleton = (rows = 6) =>
  el('div', { class: 'skeleton-list', 'aria-hidden': 'true' }, Array.from({ length: rows }, () => el('div', { class: 'skel' })));

const badge = (n) => (n > 0 ? el('span', { class: 'badge', text: n > 99 ? '99+' : String(n) }) : null);

/* ── auth ── */
let markReady;
const ready = new Promise((r) => (markReady = r));
let stopPresence = async () => {};

const requireAuth = async () => { await ready; return get('user') ? null : '/auth/sign-in'; };
const guestOnly = async () => { await ready; return get('user') ? '/chats' : null; };

const adopt = (u) => set('user', { uid: u.uid, email: u.email, emailVerified: u.emailVerified });

function initAuth() {
  onAuthStateChanged(auth, async (u) => {
    await stopPresence().catch(() => {});
    stopPresence = async () => {};
    if (!u) { set('user', null); set('profile', null); set('authReady', true); markReady(); return; }
    adopt(u);
    try {
      const s = await getDoc(doc(db, 'users', u.uid));
      if (s.exists()) set('profile', s.data());
    } catch { /* offline: profile arrives with the next snapshot */ }
    stopPresence = setupPresence(u.uid);
    set('authReady', true);
    markReady();
  });
}

// Multi-tab safe: each tab owns a connection node; a surviving tab re-asserts "online"
// if a closing tab's onDisconnect flips the shared presence node to offline.
function setupPresence(uid) {
  const me = ref(rtdb, `presence/${uid}`);
  let conn = null, connected = false;
  const online = () => rset(me, { state: 'online', at: rtsNow() }).catch(() => {});
  const offConn = onValue(ref(rtdb, '.info/connected'), async (s) => {
    connected = s.val() === true;
    if (!connected) return;
    conn = push(ref(rtdb, `status/${uid}/connections`));
    await onDisconnect(conn).remove();
    await onDisconnect(me).set({ state: 'offline', at: rtsNow() });
    rset(conn, rtsNow()).catch(() => {});
    online();
  });
  const offMe = onValue(me, (s) => { if (connected && s.val()?.state === 'offline') online(); });
  return async () => {
    offConn(); offMe(); connected = false;
    if (conn) await remove(conn).catch(() => {});
    await rset(me, { state: 'offline', at: rtsNow() }).catch(() => {});
  };
}

// Typing: first keystroke writes, then at most one refresh per 2s; clears itself after 3s of silence.
function createTyping(chatId, uid) {
  const mine = ref(rtdb, `typing/${chatId}/${uid}`);
  let timer, last = 0;
  const stop = () => {
    clearTimeout(timer);
    if (!last) return;
    last = 0;
    rset(mine, { typing: false, at: Date.now() }).catch(() => {});
  };
  return {
    ping() {
      const now = Date.now();
      if (now - last > 2000) { last = now; rset(mine, { typing: true, at: now }).catch(() => {}); }
      clearTimeout(timer);
      timer = setTimeout(stop, 3000);
    },
    stop,
    // cb receives uids (excluding me) whose heartbeat is fresh.
    listen(cb) {
      onDisconnect(mine).remove();
      return onValue(ref(rtdb, `typing/${chatId}`), (s) => {
        const now = Date.now();
        cb(Object.entries(s.val() || {}).filter(([id, v]) => id !== uid && v.typing && now - v.at < 3500).map(([id]) => id));
      });
    }
  };
}

async function logout() {
  await stopPresence().catch(() => {});
  stopPresence = async () => {};
  await signOut(auth);
  reset();
  set('authReady', true);
  navigate('/auth/sign-in', true);
}

const ERR = {
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/invalid-email': 'That email address does not look right.',
  'auth/email-already-in-use': 'An account with that email already exists.',
  'auth/weak-password': 'Choose a stronger password.',
  'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
  'auth/network-request-failed': 'No connection. Check your network.'
};
const friendly = (e) => (e.code ? ERR[e.code] || 'Something went wrong. Try again.' : e.message);

async function claimProfile(user, { name, username }) {
  const lower = username.toLowerCase();
  await runTransaction(db, async (tx) => {
    const lock = doc(db, 'usernames', lower);
    if ((await tx.get(lock)).exists()) throw new Error('Username taken.');
    tx.set(lock, { uid: user.uid });
    tx.set(doc(db, 'users', user.uid), {
      uid: user.uid, username, usernameLower: lower, name, email: user.email,
      photoURL: null, bio: '', lastSeen: null,
      createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
      settings: { theme: 'dark', fontScale: 1, notifications: true, wallpaper: null }
    });
  });
  const snap = await getDoc(doc(db, 'users', user.uid));
  set('profile', snap.data());
}

const field = (id, label, type, extra = {}) =>
  el('label', { class: 'field', for: id },
    el('span', { class: 'field__label', text: label }),
    el('input', { id, name: id, type, class: 'input', required: true, ...extra }));

function authForm({ title, fields, cta, run, footer }) {
  const err = el('p', { class: 'form-error', role: 'alert' });
  const btn = el('button', { class: 'btn btn--primary', type: 'submit', text: cta });
  const form = el('form', {
    class: 'form',
    onsubmit: async (e) => {
      e.preventDefault();
      err.textContent = '';
      btn.disabled = true;
      try { await run(Object.fromEntries(new FormData(form))); }
      catch (x) { err.textContent = friendly(x); }
      finally { btn.disabled = false; }
    }
  }, ...fields, err, btn);
  return shell(el('h2', { class: 'auth__title', text: title }), form, el('p', { class: 'auth__foot' }, ...footer));
}

const shell = (...kids) =>
  el('div', { class: 'auth' },
    el('header', {}, el('h1', { class: 'wordmark', text: 'Orbit' }),
      el('p', { class: 'tagline', text: 'Conversations in their natural orbit.' })),
    el('div', { class: 'auth__panel' }, ...kids));

function renderSignIn({ outlet }) {
  outlet.append(authForm({
    title: 'Sign in', cta: 'Sign in',
    fields: [
      field('email', 'Email', 'email', { autocomplete: 'email', inputmode: 'email' }),
      field('password', 'Password', 'password', { autocomplete: 'current-password' })
    ],
    run: async (d) => {
      const c = await signInWithEmailAndPassword(auth, d.email.trim(), d.password);
      adopt(c.user);
      navigate('/chats');
    },
    footer: ['New here? ', el('a', { class: 'link', href: '#/auth/sign-up', text: 'Create an account' }), ' · ',
      el('a', { class: 'link', href: '#/auth/forgot-password', text: 'Forgot password' })]
  }));
}

function renderSignUp({ outlet }) {
  outlet.append(authForm({
    title: 'Create your account', cta: 'Create account',
    fields: [
      field('name', 'Name', 'text', { autocomplete: 'name', maxlength: 40 }),
      field('username', 'Username', 'text', { autocomplete: 'username', maxlength: 20, autocapitalize: 'none' }),
      field('email', 'Email', 'email', { autocomplete: 'email', inputmode: 'email' }),
      field('password', 'Password', 'password', { autocomplete: 'new-password', minlength: 8 })
    ],
    run: async (d) => {
      const name = sanitizeText(d.name, 40), username = d.username.trim();
      if (!name) throw new Error('Enter your name.');
      if (!/^[a-zA-Z0-9_]{3,20}$/.test(username)) throw new Error('Username: 3–20 letters, numbers or underscores.');
      if (d.password.length < 8 || !/\d/.test(d.password) || !/[A-Za-z]/.test(d.password))
        throw new Error('Password needs 8+ characters with a letter and a number.');
      const c = await createUserWithEmailAndPassword(auth, d.email.trim(), d.password);
      try { await claimProfile(c.user, { name, username }); }
      catch (e) { await deleteUser(c.user).catch(() => {}); throw e; }
      sendEmailVerification(c.user).catch(() => {});
      adopt(c.user);
      navigate('/chats');
    },
    footer: ['Already have an account? ', el('a', { class: 'link', href: '#/auth/sign-in', text: 'Sign in' })]
  }));
}

function renderStub({ outlet }, title) {
  outlet.append(shell(
    el('h2', { class: 'auth__title', text: title }),
    el('p', { class: 'muted', text: 'Coming soon.' }),
    el('p', { class: 'auth__foot' }, el('a', { class: 'link', href: '#/auth/sign-in', text: 'Back to sign in' }))));
}

/* ── main ── */
function applyTheme(t = 'dark') {
  const r = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
  document.documentElement.dataset.theme = r;
  document.querySelector('meta[name="theme-color"]').content = r === 'light' ? '#F6F3EE' : '#0E0F11';
}
try { applyTheme(localStorage.getItem('orbit.theme') || 'dark'); } catch { applyTheme('dark'); }

subscribe('profile', (p) => {
  if (!p?.settings) return;
  applyTheme(p.settings.theme);
  document.documentElement.style.setProperty('--font-scale', p.settings.fontScale || 1);
  try { localStorage.setItem('orbit.theme', p.settings.theme); } catch { /* storage blocked */ }
});

addEventListener('offline', () => toast('You are offline. Messages will send when you reconnect.'));
addEventListener('online', () => toast('Back online.'));

const none = () => {};
const redirect = (to) => ({ guard: async () => { await ready; return typeof to === 'function' ? to() : to; }, render: none });

route('/', redirect(() => (get('user') ? '/chats' : '/auth/sign-in')));
route('/auth', redirect('/auth/sign-in'));
route('/auth/sign-in', { guard: guestOnly, render: renderSignIn });
route('/auth/sign-up', { guard: guestOnly, render: renderSignUp });
route('/auth/forgot-password', { guard: guestOnly, render: (c) => renderStub(c, 'Reset password') });
route('/auth/verify-email', { render: (c) => renderStub(c, 'Verify your email') });

// Interim home until js/chats.js ships in the next batch.
route('/chats', {
  guard: requireAuth,
  render({ outlet }) {
    const who = el('p', { class: 'muted' });
    const off = subscribe('profile', (p) => (who.textContent = p ? `Signed in as @${p.username}` : 'Signed in'), true);
    outlet.append(el('div', { class: 'home' },
      el('h1', { class: 'wordmark', text: 'Orbit' }), who,
      el('p', { class: 'muted', text: 'Your chat list arrives with the next batch.' }),
      el('a', { class: 'btn', href: '#/settings/logout', text: 'Sign out' })));
    this.leave = () => off();
  }
});

route('/settings/logout', {
  sheet: () => '/chats',
  guard: requireAuth,
  leave: leaveSheet,
  render({ outlet }) {
    openSheet(outlet, {
      title: 'Sign out of Orbit?',
      onClose: () => back('/chats'),
      body: el('div', { class: 'sheet__actions' },
        el('button', { class: 'btn', type: 'button', text: 'Cancel', onclick: () => back('/chats') }),
        el('button', { class: 'btn btn--danger', type: 'button', text: 'Sign out', onclick: () => logout() }))
    });
  }
});

route('/404', {
  render({ outlet }) {
    outlet.append(el('div', { class: 'home' }, el('h1', { class: 'wordmark', text: 'Lost in space' }),
      el('p', { class: 'muted', text: 'That page does not exist.' }),
      el('a', { class: 'btn', href: '#/chats', text: 'Back to chats' })));
  }
});
route('/*', redirect('/chats'));

initAuth();
start(document.getElementById('view'), document.getElementById('sheets'));
</script>
