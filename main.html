.sender{display:block;font-size:.75rem;font-weight:600;color:var(--accent);margin-bottom:3px}

.compose{display:flex;align-items:flex-end;gap:10px;min-height:60px;padding:10px max(12px,calc((100% - 720px)/2)) calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:linear-gradient(0deg,var(--bg-2),transparent)}

.send{flex:none;width:42px;height:42px;border:0;border-radius:50%;background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));color:var(--ink);display:grid;place-items:center;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 16px -8px var(--ring);transition:transform .12s var(--tap)}
.send:active{transform:scale(.92)}
.sheetwrap{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .24s var(--std) both}

.sheet h2{font-size:1.25rem;margin-bottom:14px}
.sheet>*{animation:rise .4s var(--out) both}
.sheet>:nth-child(1){animation-delay:.05s}.sheet>:nth-child(2){animation-delay:.08s}.sheet>:nth-child(3){animation-delay:.11s}.sheet>:nth-child(4){animation-delay:.14s}.sheet>:nth-child(n+5){animation-delay:.17s}
@keyframes sheet-in{from{opacity:0;transform:translateY(28px)}}
@keyframes pop-in{from{opacity:0;transform:scale(.96) translateY(8px)}}

.sheet .row{margin-top:2px}

.prompt .ps{color:#1f9c47}.prompt .cell{white-space:pre;min-width:2ch}.prompt .cur{background:#33ff66;color:#000}
.lock__hint{min-height:1.6em;margin:0;color:#ff5555;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:10px}
.key{height:52px;border:1px solid #1d6b36;background:#000;color:#33ff66;font:inherit;font-size:1.2rem;border-radius:0;cursor:pointer}
.key:active{background:#33ff66;color:#000}
@media (hover:hover){.key:hover{border-color:#33ff66}}
.lock__exit{background:none;border:0;color:#1f9c47;font:inherit;cursor:pointer;padding:8px}

.btn--danger{border-color:transparent;background:var(--danger-bg);color:var(--danger);box-shadow:none}

.link:hover{text-decoration:underline;text-underline-offset:3px}

<script>
(() => {
  const $ = (i) => document.getElementById(i);
  const get = (k) => { try { return localStorage.getItem(k); } catch { return null; } };

  const sdel = (k) => { try { sessionStorage.removeItem(k); } catch { /* blocked */ } };

  const th = get('orbit.theme') || 'dark';
  document.documentElement.dataset.theme = th === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : th;
  $('splash').remove(); $('app').hidden = false;
  for (let i = 0; i < 6; i++) { const d = document.createElement('div'); d.className = 'skel'; $('list').append(d); }

  const PIN = '101111';                 // <- your number lock: digits only, shown two per column
  const MAX_TRIES = 5, LOCKOUT_MS = 30000;
  if (sget('orbit.unlocked') === '1') { window.orbitLock = Promise.resolve(); return; }
  window.orbitLock = new Promise((resolve) => {
    const lock = $('lock'), prompt = $('prompt'), hint = $('lockHint'), pad = $('pad');

}
async function newGroupSheet() {

async function groupSheet(c) {

      el('div', { class: 'row__main' }, el('span', { class: 'row__name', text: p.name + (uid === me.uid ? ' (you)' : '') + (c.admins?.includes(uid) ? ' · admin' : '') }), el('p', { class: 'row__prev', text: '@' + p.username })));

async function addPeopleSheet(c) {
  await loadPeople();

  const err = el('p', { class: 'form-msg form-error', role: 'alert' });
  const go = el('button', { class: 'btn btn--primary', type: 'button', text: 'Add', onclick: async () => {

async function leaveGroup(c) {

// ── Conversation ──
function closeChat() { if (activeId) markRead(activeId); cleanups.forEach((f) => { try { f(); } catch { /* already closed */ } }); cleanups = []; }
const paneEmpty = () => $('pane').replaceChildren(el('p', { class: 'empty-pane', text: 'Select a conversation' }));

async function openChat(id) {
  if (id === activeId && cleanups.length) { $('app').dataset.view = 'chat'; return; }
  closeChat();
  activeId = id;
  $('app').dataset.view = 'chat';
  renderList();
  let c = null;
  try { c = await chatInfo(id); } catch { /* not a member */ }
  if (activeId !== id) return;
  if (!c || !c.memberIds?.includes(me.uid)) {
    return $('pane').replaceChildren(el('p', { class: 'empty-pane', text: 'Conversation not found.' }), el('a', { class: 'link note', href: '#/chats', text: 'Back to chats' }));
  }
  const peer = c.type === 'direct' ? c.memberIds.find((x) => x !== me.uid) : null;
  const mcol = R.ref(rdb, 'messages/' + id);
  const kf = keyFor(c);
  const title = el('strong', { text: peer ? '…' : c.name || 'Group' });
  const status = el('small', { text: '' });
  const av = el('div', { class: 'avatar', text: peer ? '' : initial(c.name) });
  const older = el('button', { class: 'btn older', type: 'button', text: 'Load earlier messages', onclick: () => loadOlder() });
  const empty = el('p', { class: 'empty', text: 'Say hello.' });
  const msgs = el('div', { class: 'msgs', role: 'log', 'aria-live': 'polite' }, older, empty);
  const ta = el('textarea', { rows: '1', maxlength: '2000', placeholder: 'Message', 'aria-label': 'Message' });
  const sendBtn = el('button', { class: 'send', type: 'button', 'aria-label': 'Send' }, icon('send'));
  const FPK = 'orbit.fp';
  const checkFp = () => {
    if (!peer || !me.priv) return;
    safetyCode(peer).then((code) => {
      let fp = {}; try { fp = JSON.parse(localStorage.getItem(FPK) || '{}'); } catch { /* ignore */ }
      if (fp[peer] && fp[peer] !== code) toast(`⚠ Security code with ${title.textContent} changed. Verify it with them.`);
      fp[peer] = code;
      try { localStorage.setItem(FPK, JSON.stringify(fp)); } catch { /* storage blocked */ }
    }).catch(() => {});
  };
  const vbtn = el('button', { class: 'iconbtn vbtn', type: 'button', 'aria-label': 'Verify encryption', onclick: async () => {
    try {
      const code = await safetyCode(peer);
      alert(`Security code with ${title.textContent}\n\n${code}\n\nCompare this with ${title.textContent} in person or on a call. If it matches, nobody can read or change your chat in between.`);
    } catch { toast('Encryption keys are not ready yet.'); }
  } }, icon('lock'));
  const gbtn = el('button', { class: 'iconbtn vbtn', type: 'button', 'aria-label': 'Group info', onclick: async () => { const fresh = await chatInfo(id); if (fresh) groupSheet(fresh); } }, icon('users'));
  $('pane').replaceChildren(
    el('header', { class: 'chead' }, el('a', { class: 'iconbtn back', href: '#/chats', 'aria-label': 'Back' }, icon('back')), av, el('div', { class: 'chead__t' }, title, status), peer ? vbtn : gbtn),
    msgs, el('div', { class: 'compose' }, ta, sendBtn));

  let typingNow = false, online = false, tTimer, W = null, tt, lastW = 0, alive = true;
  const setStatus = () => {
    status.textContent = typingNow ? 'typing…' : peer ? (online ? 'online' : 'offline') : `${c.memberCount || c.memberIds.length} members`;
    status.classList.toggle('is-typing', typingNow);
    av.classList.toggle('is-online', online);
  };
  if (peer) getProfile(peer).then((p) => { title.textContent = p.name; av.textContent = initial(p.name); setStatus(); });
  setStatus();
  const typingStop = () => { clearTimeout(tt); if (!lastW) return; lastW = 0; W?.({ typing: false, at: Date.now() }); };
  cleanups.push(() => { alive = false; clearTimeout(tTimer); }, typingStop);
  cleanups.push(R.onValue(R.ref(rdb, `chats/${id}/members`), (s) => {
    const v = s.val();
    if (!v) return;
    c.memberIds = Object.keys(v); c.memberCount = c.memberIds.length;
    if (!v[me.uid]) location.hash = '#/chats';
    setStatus();
  }, () => {}));
  rt().then(({ m: R, db: rdb }) => {
    if (!alive) return;
    cleanups.push(R.onValue(R.ref(rdb, 'typing/' + id), (s) => {
      const n = Date.now();
      typingNow = Object.entries(s.val() || {}).some(([u, v]) => u !== me.uid && v.typing && n - v.at < 3500);
      setStatus(); clearTimeout(tTimer);
      if (typingNow) tTimer = setTimeout(() => { typingNow = false; setStatus(); }, 3600);
    }));
    if (peer) cleanups.push(R.onValue(R.ref(rdb, 'presence/' + peer), (s) => { online = s.val()?.state === 'online'; setStatus(); }));
    const mine = R.ref(rdb, `typing/${id}/${me.uid}`);
    R.onDisconnect(mine).remove().catch(() => {});
    W = (v) => R.set(mine, v).catch(() => {});
  });

  // incremental message DOM: nodes are created once so entry animations never replay
  const store = new Map(), nodes = new Map(), plain = new Map(), asking = new Set(), pendingIds = new Set();
  let rs = 0;
  const resync = () => { cancelAnimationFrame(rs); rs = requestAnimationFrame(() => sync(pinned)); };
  const kw = () => { resync(); checkFp(); };
  keyWaiters.add(kw); cleanups.push(() => keyWaiters.delete(kw));
  if (peer) checkFp();
  const body = (m) => {
    if (m.deleted) return 'Message deleted';
    if (m.enc !== 1) return m.text;                 // message from before encryption was added
    if (plain.has(m.id)) return plain.get(m.id) ?? '🔒 Can’t decrypt this message';
    if (me.priv && !asking.has(m.id)) {
      asking.add(m.id);
      unseal(kf, id, m.senderId, m).then((x) => { plain.set(m.id, x); resync(); });
    }
    return '…';
  };
  let oldest = null, noMore = false, first = true, live = false, pinned = true, loadingOlder = false;
  const at = (m) => ms(m.at);
  function sync(stick) {
    const list = [...store.values()].sort((a, b) => at(a) - at(b) || a.id.localeCompare(b.id));
    empty.hidden = list.length > 0;
    older.hidden = noMore;
    let prev = older, prevMsg = null;
    for (const m of list) {
      const mineMsg = m.senderId === me.uid;
      let n = nodes.get(m.id);
      if (!n) {
        n = el('div', {}, el('div', { class: 'bubble' }, el('span', { class: 'sender' }), el('span', { class: 'txt' }), el('span', { class: 'meta' })));
        nodes.set(m.id, n);
        const mid = m.id;
        n.addEventListener('dblclick', async () => {
          const cur = store.get(mid);
          if (!cur || cur.deleted || cur.pending || cur.senderId !== me.uid) return;
          if (!confirm('Delete this message for everyone?')) return;

        });
      }
      const isFirst = !prevMsg || prevMsg.senderId !== m.senderId;

      n.dataset.seen = '1';
      const [who, txt, meta] = n.firstChild.children;
      who.hidden = !(c.type === 'group' && !mineMsg && isFirst);
      who.textContent = m.senderName || '';
      txt.textContent = body(m);
      meta.textContent = hm.format(at(m) || Date.now()) + (m.edited || m.editedAt ? ' · edited' : '') + (m.pending ? ' · sending' : '');
      if (n.previousElementSibling !== prev) msgs.insertBefore(n, prev.nextSibling);
      prev = n; prevMsg = m;
    }
    if (stick) msgs.scrollTop = msgs.scrollHeight;
  }
  cleanups.push(R.onValue(R.query(mcol, R.orderByKey(), R.limitToLast(30)), (snap) => {
    let mineAdded = false, firstKey = null;
    snap.forEach((s) => {
      const v = s.val();
      if (firstKey === null) firstKey = s.key;
      if (!store.has(s.key) && v.senderId === me.uid) mineAdded = true;
      store.set(s.key, { id: s.key, ...v, pending: pendingIds.has(s.key) });
    });
    if (first) { oldest = firstKey; noMore = snap.size < 30; }
    sync(first || pinned || mineAdded);
    first = false; live = true;
  }, () => { empty.textContent = 'Could not load messages.'; }));

  async function loadOlder() {
    if (loadingOlder || noMore || !oldest) return;
    loadingOlder = true;
    try {
      const s = await R.get(R.query(mcol, R.orderByKey(), R.endBefore(oldest), R.limitToLast(30)));
      if (s.size < 30) noMore = true;
      let firstKey = null;
      const h = msgs.scrollHeight;
      s.forEach((d) => { if (firstKey === null) firstKey = d.key; store.set(d.key, { id: d.key, ...d.val() }); });
      if (firstKey) oldest = firstKey;
      live = false; sync(false); live = true;
      msgs.scrollTop += msgs.scrollHeight - h;
    } catch { toast('Could not load earlier messages.'); }
    finally { loadingOlder = false; }
  }
  msgs.addEventListener('scroll', () => {
    pinned = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight <= 40;
    if (msgs.scrollTop < 80) loadOlder();
  }, { passive: true });

  const resize = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; };
  async function send() {
    const text = clean(ta.value);
    if (!text) return;
    if (!me.priv) return void toast('Secure messaging is still starting. Try again in a moment.');
    ta.value = ''; resize(); typingStop();
    navigator.vibrate?.(10);
    const mkey = R.push(mcol).key;
    let a, b;
    try { [a, b] = await Promise.all([seal(kf, id, me.uid, text), seal(kf, id, me.uid, text.slice(0, 120))]); }
    catch (e) {
      ta.value = text; resize();
      return void toast(e.message === 'nokey' ? (peer ? `${title.textContent} has not set up secure messaging yet.` : 'This group’s key is not available to you.') : 'Could not encrypt the message.');
    }
    plain.set(mkey, text); pendingIds.add(mkey);
    // one atomic write: the message plus the preview in every member's chat list
    const upd = { [`messages/${id}/${mkey}`]: { text: a.text, iv: a.iv, enc: 1, senderId: me.uid, senderName: me.name, at: R.serverTimestamp(), deleted: false } };
    const last = { text: b.text, iv: b.iv, enc: 1, senderId: me.uid, senderName: me.name };
    for (const m of c.memberIds) {
      upd[`userChats/${m}/${id}`] = { type: c.type, ...(peer ? { peer: m === me.uid ? peer : me.uid } : { name: c.name }), at: R.serverTimestamp(), last };
    }

      .then(() => { pendingIds.delete(mkey); const m = store.get(mkey); if (m) { m.pending = false; resync(); } })
      .catch(() => {

      });
  }
  sendBtn.addEventListener('click', send);
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer: coarse)').matches) { e.preventDefault(); send(); } });
  ta.addEventListener('input', () => {
    resize();
    if (!ta.value.trim()) return typingStop();
    const n = Date.now();
    if (n - lastW > 2000) { lastW = n; W?.({ typing: true, at: n }); }
    clearTimeout(tt); tt = setTimeout(typingStop, 3000);
  });
}

// ── Routing: #/chats, #/chats/:id, #/people ──
function route() {
  const m = (location.hash.replace(/^#/, '') || '/chats').match(/^\/(chats|people)(?:\/([^/?]+))?\/?(?:\?.*)?$/);
  if (!m || (m[1] === 'people' && m[2])) return void location.replace('#/chats');
  showTab(m[1]);
  if (m[1] === 'people') { $('app').dataset.view = 'list'; if (!activeId) paneEmpty(); return; }
  if (m[2]) return void openChat(decodeURIComponent(m[2]));
  closeChat(); activeId = null; $('app').dataset.view = 'list'; paneEmpty();
}

const ss = {
  get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch { /* storage blocked */ } },
  del: (k) => { try { sessionStorage.removeItem(k); } catch { /* storage blocked */ } }
};

// ── Profile: accounts are made by the admin in Firebase, so the profile is created on first sign-in ──
async function provision(u) {
  const base = (u.email || 'user').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 16);
  const local = base.length >= 3 ? base : (base + 'user').slice(0, 16);
  const name = (u.displayName || local.charAt(0).toUpperCase() + local.slice(1)).slice(0, 40);
  for (let i = 0; i < 6; i++) {
    const username = local + (i ? String(Math.floor(Math.random() * 90) + 10) : '');
    const profile = {
      uid: u.uid, username, usernameLower: username.toLowerCase(), name, bio: '',
      createdAt: R.serverTimestamp(), updatedAt: R.serverTimestamp(),
      settings: { theme: 'dark', fontScale: 1, notifications: true }
    };
    try {
      // atomic: if the username is already taken the rules reject the whole write
      await R.update(R.ref(rdb), { ['usernames/' + username.toLowerCase()]: u.uid, ['users/' + u.uid]: profile });
      return (await R.get(R.ref(rdb, 'users/' + u.uid))).val();
    } catch (e) { if (e?.code !== 'PERMISSION_DENIED') throw e; }
  }
  throw new Error('No free username');
}
async function loadProfile(u) {
  let p = null;
  try { const s = await R.get(R.ref(rdb, 'users/' + u.uid)); if (s.exists()) p = s.val(); } catch { /* offline */ }
  if (!p && navigator.onLine) { try { p = await provision(u); } catch { /* retried next load */ } }
  if (!p) return null;
  me.name = p.name; me.username = p.username; fillMe();
  try { localStorage.setItem('orbit.me', JSON.stringify({ uid: u.uid, name: p.name, username: p.username })); } catch { /* storage blocked */ }
  if (p.settings) {
    applyTheme(p.settings.theme);
    document.documentElement.style.setProperty('--font-scale', p.settings.fontScale || 1);
    try { localStorage.setItem('orbit.theme', p.settings.theme); } catch { /* storage blocked */ }
  }
  return p;
}

let started = false, presP = null;
const fillMe = () => {
  $('meAv').textContent = initial(me.name);
  $('meName').textContent = me.name;
  $('meHandle').textContent = me.username ? '@' + me.username : '';
};
async function stopPresence() { if (!presP) return; try { (await presP)(); } catch { /* never started */ } }
async function doSignOut() {
  $('out').disabled = true;
  ss.del('orbit.unlocked');
  try { ['orbit.hint', 'orbit.me', 'orbit.pc'].forEach((k) => localStorage.removeItem(k)); } catch { /* storage blocked */ }
  closeChat();
  await stopPresence();
  await signOut(auth);
  location.replace('index.html');
}
document.addEventListener('orbit:signout', doSignOut);
if (window.__wantExit) doSignOut();
// Re-lock after the tab has been in the background for two minutes
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 120000) { ss.del('orbit.unlocked'); location.reload(); }
});

onAuthStateChanged(auth, async (u) => {
  if (!u) {
    ss.del('orbit.unlocked');
    try { localStorage.removeItem('orbit.hint'); } catch { /* storage blocked */ }
    return location.replace('index.html');
  }
  if (started) return;
  started = true;
  me.uid = u.uid; me.name = (u.email || 'me').split('@')[0];
  try { const c = JSON.parse(localStorage.getItem('orbit.me') || 'null'); if (c && c.uid === u.uid) { me.name = c.name; me.username = c.username; } } catch { /* ignore */ }
  fillMe();
  await window.orbitLock;                       // PIN was typed while the SDK was still downloading
  startChats();
  route();
  addEventListener('hashchange', route);
  const keysP = loadLocalKeys(u.uid).then(() => { renderList(); keyWaiters.forEach((f) => f()); });
  Promise.all([keysP, loadProfile(u)]).then(([, p]) => ensureKeys(u, p));   // never blocks the UI
  requestAnimationFrame(() => { presP = startPresence(u.uid); });
});

$('gBtn').append(icon('plus'));
$('gBtn').addEventListener('click', newGroupSheet);
$('scrim').addEventListener('click', closeSheet);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
$('tabChats').addEventListener('click', () => { location.hash = activeId && matchMedia('(min-width: 768px)').matches ? '#/chats/' + activeId : '#/chats'; });
$('tabPeople').addEventListener('click', () => { location.hash = '#/people'; });
$('out').addEventListener('click', doSignOut);
addEventListener('offline', () => toast('You are offline. Messages will send when you reconnect.'));
</script>
