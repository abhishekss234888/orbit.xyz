<style>:root,[data-theme="dark"]{--bg:#0E0F11;--bg-elevated:#15171A;--surface:#1A1D21;--surface-hover:#212529;--border:#262A2F;--border-strong:#353A41;--text-primary:#ECEAE6;--text-secondary:#A9A7A1;--text-muted:#8A8B84;--text-inverse:#17120B;--accent:#F2A65A;--accent-hover:#F5B676;--accent-pressed:#D98F43;--accent-subtle:#F2A65A24;--online:#5BD28A;--danger:#F0645B;--danger-subtle:#F0645B22}
[data-theme="light"]{--bg:#F6F3EE;--bg-elevated:#FBF9F5;--surface:#FBF9F5;--surface-hover:#EFEBE4;--border:#E3DED5;--border-strong:#CFC8BC;--text-primary:#1B1A17;--text-secondary:#55524B;--text-muted:#7A766D;--text-inverse:#FFF8EE;--accent:#B5600C;--accent-hover:#9F5409;--accent-pressed:#8A4807;--accent-subtle:#B5600C1A;--online:#1E9E5A;--danger:#C93C33;--danger-subtle:#C93C331A}
:root{--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-12:48px;--r-2:12px;--r-pill:999px;--font-ui:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--font-body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--ease-out:cubic-bezier(0.16,1,0.3,1);--ease-tap:cubic-bezier(0.2,0,0,1);--ease-std:cubic-bezier(0.4,0,0.2,1);--font-scale:1}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(100% * var(--font-scale))}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text-primary);font:400 .875rem/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-family:var(--font-ui);font-weight:600}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.splash{position:fixed;inset:0;display:grid;place-items:center}
.splash i{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.8);opacity:.35}}
.auth{min-height:100dvh;display:grid;align-content:center;gap:var(--sp-12);padding:var(--sp-6);max-width:1000px;margin:0 auto}
.wordmark{font-size:1.75rem;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.tagline{margin:var(--sp-2) 0 0;color:var(--text-secondary);font-size:1rem}
.auth__panel{max-width:360px;width:100%}
.auth__title{font-size:1.25rem;letter-spacing:-.01em;margin-bottom:var(--sp-5)}
.form{display:grid;gap:var(--sp-4)}
.field{display:grid;gap:6px}
.field__label{font-size:.75rem;color:var(--text-secondary);font-weight:500}
.input{width:100%;min-height:44px;padding:0 var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);font-size:1rem;transition:border-color 140ms var(--ease-std)}
.input:hover{border-color:var(--border-strong)}
.input:focus{outline:none;border-color:var(--accent)}
.form-msg{margin:0;min-height:1.2em;font-size:.8125rem}
.form-error{color:var(--danger)}
.form-ok{color:var(--online)}
.btn{min-height:44px;padding:0 var(--sp-5);border:1px solid var(--border-strong);border-radius:var(--r-2);background:transparent;cursor:pointer;font:600 .875rem var(--font-ui);transition:transform 120ms var(--ease-tap),background 140ms var(--ease-std)}

.btn:disabled{opacity:.5;cursor:default}
.btn--primary{background:var(--accent);border-color:transparent;color:var(--text-inverse)}
.btn--primary:hover:not(:disabled){background:var(--accent-hover)}
.btn--primary:active:not(:disabled){background:var(--accent-pressed)}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}
.auth__foot{margin-top:var(--sp-5);color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:6px 10px}
@media (min-width:768px){.auth{grid-template-columns:1fr 360px;align-items:center;gap:var(--sp-12)}.wordmark{font-size:3.5rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}


:root,[data-theme="dark"]{--bubble-me-bg:#F2A65A;--bubble-me-text:#17120B;--bubble-them-bg:#1E2125;--bubble-them-text:#ECEAE6;--overlay-scrim:rgba(5,6,7,.62);--shadow-3:0 16px 48px rgba(0,0,0,.6)}

.back{display:grid}

.ext{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:70;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-secondary);opacity:.92;text-decoration:none;touch-action:manipulation;transition:transform 120ms var(--ease-tap),color 140ms var(--ease-std),border-color 140ms var(--ease-std)}

html{-webkit-tap-highlight-color:transparent}a,button{touch-action:manipulation}

.bar{padding-right:60px}.chead{padding-right:max(60px,calc((100% - 720px)/2))}
.skel{position:relative;overflow:hidden;height:56px;margin:6px 16px;border-radius:var(--r-2);background:var(--surface)}
.skel::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--border),transparent);transform:translateX(-100%);animation:shimmer 1.4s linear infinite}
@keyframes shimmer{to{transform:translateX(100%)}}

.lock{position:fixed;inset:0;z-index:60;background:#000;color:#33ff66;font:15px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px}
.lock .t{margin:0;color:#1f9c47;white-space:pre}

.lock input:focus{outline:none;border-color:#33ff66}

    const lock = $('lock'), prompt = $('prompt'), hint = $('lockHint'), pad = $('pad');
    const mk = (cls, text) => { const s = document.createElement('span'); s.className = cls; s.textContent = text; return s; };
    const cells = [];
    for (let c = 0; c < Math.ceil(PIN.length / 2); c++) { const cell = mk('cell', ''); cells.push(cell); prompt.append(mk('ps', '$'), cell); }
    prompt.append(mk('ps', '$'));

    const paint = () => cells.forEach((cell, c) => {
      let s = '';
      for (let i = 0; i < 2; i++) { const k = c * 2 + i; if (k < PIN.length) s += val[k] ?? '_'; }

      clearInterval(ticker); hint.textContent = '';

    addEventListener('keydown', onKey);

      txt.textContent = body(m);
      meta.textContent = hm.format(at(m) || Date.now()) + (m.edited || m.editedAt ? ' · edited' : '') + (m.pending ? ' · sending' : '');
      if (n.previousElementSibling !== prev) msgs.insertBefore(n, prev.nextSibling);
      prev = n; prevMsg = m;
    }
    if (stick) msgs.scrollTop = msgs.scrollHeight;
  }
  cleanups.push(onSnapshot(query(mcol, orderBy('at', 'desc'), limit(30)), (snap) => {
    let mineAdded = false;
    snap.docChanges().forEach((ch) => {
      const d = ch.doc;
      if (ch.type === 'removed') {
        // a rejected local write disappears; documents that merely left the 30-message window stay
        if (d.metadata.hasPendingWrites) { store.delete(d.id); nodes.get(d.id)?.remove(); nodes.delete(d.id); }
        return;
      }
      const data = d.data({ serverTimestamps: 'estimate' });
      if (ch.type === 'added' && data.senderId === me.uid) mineAdded = true;
      store.set(d.id, { id: d.id, ...data, pending: d.metadata.hasPendingWrites });
    });
    if (first) { oldest = snap.docs[snap.docs.length - 1] || null; noMore = snap.size < 30; }
    sync(first || pinned || mineAdded);
    first = false; live = true;
  }, () => { empty.textContent = 'Could not load messages.'; }));

  async function loadOlder() {
    if (loadingOlder || noMore || !oldest) return;
    loadingOlder = true;
    try {
      const s = await getDocs(query(mcol, orderBy('at', 'desc'), startAfter(oldest), limit(30)));
      if (s.size < 30) noMore = true;
      if (s.size) oldest = s.docs[s.size - 1];
      const h = msgs.scrollHeight;
      s.docs.forEach((d) => store.set(d.id, { id: d.id, ...d.data() }));
      live = false; sync(false); live = true;
      msgs.scrollTop += msgs.scrollHeight - h;
    } catch { toast('Could not load earlier messages.'); }
    finally { loadingOlder = false; }
  }
  msgs.addEventListener('scroll', () => {
    pinned = msgs.scrollHeight - msgs.scrollTop - msgs.clientHeight <= 40;
    if (msgs.scrollTop < 80) loadOlder();
  }, { passive: true });

  const resize = () => { ta.style.height = 'auto'; ta.style.height = Math.min(ta.scrollHeight, 120) + 'px'; };
  async function send() {
    const text = clean(ta.value);
    if (!text) return;
    if (!peer) return void toast('Group chats are not available yet.');
    if (!me.priv) return void toast('Secure messaging is still starting. Try again in a moment.');
    ta.value = ''; resize(); typingStop();
    navigator.vibrate?.(10);
    const mref = doc(mcol);
    let a, b;
    try { [a, b] = await Promise.all([seal(peer, id, me.uid, text), seal(peer, id, me.uid, text.slice(0, 120))]); }
    catch (e) {
      ta.value = text; resize();
      return void toast(e.message === 'nokey' ? `${title.textContent} has not set up secure messaging yet.` : 'Could not encrypt the message.');
    }
    plain.set(mref.id, text);
    const batch = writeBatch(db);
    batch.set(mref, { text: a.text, iv: a.iv, enc: 1, senderId: me.uid, senderName: me.name, senderPhotoURL: null, at: serverTimestamp(), editedAt: null, deleted: false, readBy: {} });
    batch.update(doc(db, 'chats', id), { lastMessage: { text: b.text, iv: b.iv, enc: 1, senderId: me.uid, senderName: me.name, at: serverTimestamp(), type: 'text' } });
    batch.commit().catch(() => { plain.delete(mref.id); ta.value = text; resize(); toast('Message not sent. Check your connection and try again.'); });
  }
  sendBtn.addEventListener('click', send);
  ta.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey && !matchMedia('(pointer: coarse)').matches) { e.preventDefault(); send(); } });
  ta.addEventListener('input', () => {
    resize();
    if (!ta.value.trim()) return typingStop();
    const n = Date.now();
    if (n - lastW > 2000) { lastW = n; W?.({ typing: true, at: n }); }
    clearTimeout(tt); tt = setTimeout(typingStop, 3000);
  });
}

// ── Routing: #/chats, #/chats/:id, #/people ──
function route() {
  const m = (location.hash.replace(/^#/, '') || '/chats').match(/^\/(chats|people)(?:\/([^/?]+))?\/?(?:\?.*)?$/);
  if (!m || (m[1] === 'people' && m[2])) return void location.replace('#/chats');
  showTab(m[1]);
  if (m[1] === 'people') { $('app').dataset.view = 'list'; if (!activeId) paneEmpty(); return; }
  if (m[2]) return void openChat(decodeURIComponent(m[2]));
  closeChat(); activeId = null; $('app').dataset.view = 'list'; paneEmpty();
}

const ss = {
  get: (k) => { try { return sessionStorage.getItem(k); } catch { return null; } },
  set: (k, v) => { try { sessionStorage.setItem(k, v); } catch { /* storage blocked */ } },
  del: (k) => { try { sessionStorage.removeItem(k); } catch { /* storage blocked */ } }
};

// ── Profile: accounts are made by the admin in Firebase, so the profile is created on first sign-in ──
async function provision(u) {
  const base = (u.email || 'user').split('@')[0].toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 16);
  const local = base.length >= 3 ? base : (base + 'user').slice(0, 16);
  const name = u.displayName || local.charAt(0).toUpperCase() + local.slice(1);
  const userRef = doc(db, 'users', u.uid);
  for (let i = 0; i < 6; i++) {
    const username = local + (i ? String(Math.floor(Math.random() * 90) + 10) : '');
    try {
      await runTransaction(db, async (tx) => {
        const lock = doc(db, 'usernames', username.toLowerCase());
        if ((await tx.get(lock)).exists()) throw new Error('Username taken.');
        tx.set(lock, { uid: u.uid });
        tx.set(userRef, {
          uid: u.uid, username, usernameLower: username.toLowerCase(), name,
          photoURL: null, bio: '', lastSeen: null, createdAt: serverTimestamp(), updatedAt: serverTimestamp(),
          settings: { theme: 'dark', fontScale: 1, notifications: true, wallpaper: null }
        });
      });
      return (await getDoc(userRef)).data();
    } catch (e) { if (e.message !== 'Username taken.') throw e; }
  }
  throw new Error('No free username');
}
async function loadProfile(u) {
  let p = null;
  try { const s = await getDoc(doc(db, 'users', u.uid)); if (s.exists()) p = s.data(); } catch { /* offline */ }
  if (!p && navigator.onLine) { try { p = await provision(u); } catch { /* retried next load */ } }
  if (!p) return null;
  me.name = p.name; me.username = p.username; fillMe();
  try { localStorage.setItem('orbit.me', JSON.stringify({ uid: u.uid, name: p.name, username: p.username })); } catch { /* storage blocked */ }
  if (p.settings) {
    applyTheme(p.settings.theme);
    document.documentElement.style.setProperty('--font-scale', p.settings.fontScale || 1);
    try { localStorage.setItem('orbit.theme', p.settings.theme); } catch { /* storage blocked */ }
  }
  return p;
}

let started = false, presP = null;
const fillMe = () => {
  $('meAv').textContent = initial(me.name);
  $('meName').textContent = me.name;
  $('meHandle').textContent = me.username ? '@' + me.username : '';
};
async function stopPresence() { if (!presP) return; try { (await presP)(); } catch { /* never started */ } }
async function doSignOut() {
  $('out').disabled = true;
  ss.del('orbit.unlocked');
  try { ['orbit.hint', 'orbit.me', 'orbit.pc'].forEach((k) => localStorage.removeItem(k)); } catch { /* storage blocked */ }
  closeChat();
  await stopPresence();
  await signOut(auth);
  location.replace('index.html');
}
document.addEventListener('orbit:signout', doSignOut);
if (window.__wantExit) doSignOut();
// Re-lock after the tab has been in the background for two minutes
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 120000) { ss.del('orbit.unlocked'); location.reload(); }
});

onAuthStateChanged(auth, async (u) => {
  if (!u) {
    ss.del('orbit.unlocked');
    try { localStorage.removeItem('orbit.hint'); } catch { /* storage blocked */ }
    return location.replace('index.html');
  }
  if (started) return;
  started = true;
  me.uid = u.uid; me.name = (u.email || 'me').split('@')[0];
  try { const c = JSON.parse(localStorage.getItem('orbit.me') || 'null'); if (c && c.uid === u.uid) { me.name = c.name; me.username = c.username; } } catch { /* ignore */ }
  fillMe();
  await window.orbitLock;                       // PIN was typed while the SDK was still downloading
  startChats();
  route();
  addEventListener('hashchange', route);
  const keysP = loadLocalKeys(u.uid).then(() => { renderList(); keyWaiters.forEach((f) => f()); });
  Promise.all([keysP, loadProfile(u)]).then(([, p]) => ensureKeys(u, p));   // never blocks the UI
  requestAnimationFrame(() => { presP = startPresence(u.uid); });
});

$('tabChats').addEventListener('click', () => { location.hash = activeId && matchMedia('(min-width: 768px)').matches ? '#/chats/' + activeId : '#/chats'; });
$('tabPeople').addEventListener('click', () => { location.hash = '#/people'; });
$('out').addEventListener('click', doSignOut);
addEventListener('offline', () => toast('You are offline. Messages will send when you reconnect.'));
</script>
