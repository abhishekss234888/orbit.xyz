<!doctype html>
<html lang="en" data-theme="dark">
<head>
<title>Orbit · Sign in</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Conversations in their natural orbit.">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E0F11">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">

<style>:root,[data-theme=dark]{color-scheme:dark;--bg:#0E0F11;--bg-2:#121316;--surface:#17191D;--surface-2:#1E2126;--surface-3:#262A31;--hover:rgba(255,255,255,.045);--selected:rgba(232,162,91,.11);--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.12);--hi:rgba(255,255,255,.06);--tx:#F1EFEA;--tx-2:#ABA8A1;--tx-3:#8A8781;--accent:#E8A25B;--accent-hi:#F4B672;--accent-lo:#DB9040;--ink:#1B1207;--ring:rgba(232,162,91,.34);--tint:rgba(232,162,91,.16);--online:#5BD28A;--danger:#F0645B;--danger-bg:rgba(240,100,91,.14);--glass:rgba(26,28,33,.74);--glass-solid:#1B1D22;--me-a:#F0AC63;--me-b:#E2984A;--me-tx:#1B1207;--them-a:#21252B;--them-b:#1B1E23;--them-tx:#F1EFEA;--scrim:rgba(4,5,6,.56);--glow:rgba(232,162,91,.075);--sh-1:0 1px 2px rgba(0,0,0,.35);--sh-2:0 10px 28px -10px rgba(0,0,0,.6),0 2px 6px rgba(0,0,0,.25);--sh-3:0 30px 70px -18px rgba(0,0,0,.75),0 8px 22px -8px rgba(0,0,0,.45)}
[data-theme=light]{color-scheme:light;--bg:#F6F3EE;--bg-2:#F1EDE6;--surface:#FBF9F5;--surface-2:#FFFFFF;--surface-3:#F3EFE8;--hover:rgba(40,30,15,.05);--selected:rgba(181,96,12,.09);--line:rgba(40,30,15,.09);--line-2:rgba(40,30,15,.15);--hi:rgba(255,255,255,.8);--tx:#1B1A17;--tx-2:#57534C;--tx-3:#7C776E;--accent:#B5600C;--accent-hi:#C66F18;--accent-lo:#A35509;--ink:#FFF8EE;--ring:rgba(181,96,12,.3);--tint:rgba(181,96,12,.12);--online:#1E9E5A;--danger:#C93C33;--danger-bg:rgba(201,60,51,.1);--glass:rgba(251,249,245,.8);--glass-solid:#FBF9F5;--me-a:#C26B14;--me-b:#AD5A0A;--me-tx:#FFF8EE;--them-a:#ECE7DE;--them-b:#E7E1D7;--them-tx:#1B1A17;--scrim:rgba(30,22,10,.36);--glow:rgba(181,96,12,.07);--sh-1:0 1px 2px rgba(60,40,10,.1);--sh-2:0 10px 28px -10px rgba(60,40,10,.25),0 2px 6px rgba(60,40,10,.08);--sh-3:0 30px 70px -18px rgba(60,40,10,.35),0 8px 22px -8px rgba(60,40,10,.18)}
:root{--font:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--out:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.32,.72,0,1);--tap:cubic-bezier(.2,0,0,1);--std:cubic-bezier(.4,0,.2,1);--font-scale:1}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(100% * var(--font-scale));-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--tx);font:400 .9375rem/1.45 var(--font);letter-spacing:-.006em;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
h1,h2{margin:0;font-weight:650;letter-spacing:-.022em;line-height:1.15}
button,input,textarea{font:inherit;color:inherit}
a,button{touch-action:manipulation}
::selection{background:var(--ring)}
::placeholder{color:var(--tx-3)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.4)}}
.splash{position:fixed;inset:0;display:grid;place-items:center}
.splash i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 7px var(--tint);animation:pop .7s var(--out) both}
.wordmark{font-size:1.75rem;font-weight:700;letter-spacing:-.04em;line-height:1.1;background:linear-gradient(180deg,var(--tx),var(--tx-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn{min-height:44px;padding:0 20px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface-2);color:var(--tx);font-weight:600;font-size:.9rem;letter-spacing:-.005em;cursor:pointer;box-shadow:inset 0 1px 0 var(--hi),var(--sh-1);transition:transform .12s var(--tap),background-color .16s var(--std),filter .16s var(--std)}
@media (hover:hover){.btn:hover:not(:disabled){background:var(--surface-3)}.btn--primary:hover:not(:disabled){background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));filter:brightness(1.06)}}
.btn:active:not(:disabled){transform:scale(.975)}
.btn:disabled{opacity:.5;cursor:default}
.btn--primary{border-color:transparent;background:linear-gradient(180deg,var(--accent-hi),var(--accent-lo));color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 18px -8px var(--ring)}
.input{width:100%;min-height:46px;padding:0 14px;background:var(--surface);color:var(--tx);border:1px solid var(--line);border-radius:12px;font-size:1rem;box-shadow:inset 0 1px 2px rgba(0,0,0,.16);transition:border-color .16s var(--std),box-shadow .16s var(--std)}
.input:hover{border-color:var(--line-2)}
.input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.form{display:grid;gap:16px}
.form-msg{margin:0;min-height:1.25em;font-size:.8125rem}
.form-error{color:var(--danger)}
.ext{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:90;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--tx-2);background:var(--glass-solid);border:1px solid var(--line-2);box-shadow:var(--sh-1),inset 0 1px 0 var(--hi);text-decoration:none;transition:transform .12s var(--tap),color .16s var(--std),border-color .16s var(--std)}
.ext:hover{color:var(--accent);border-color:var(--accent)}
.ext:active{transform:scale(.92)}
@supports (backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px)){.ext{background:var(--glass);-webkit-backdrop-filter:blur(12px) saturate(150%);backdrop-filter:blur(12px) saturate(150%)}}
@media (prefers-reduced-transparency:reduce){.ext{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
body{background:radial-gradient(90% 55% at 10% 0,var(--glow),transparent 62%) no-repeat,var(--bg)}
.auth{min-height:100dvh;display:grid;align-content:center;gap:40px;padding:24px;max-width:1040px;margin:0 auto}
.auth>header,.auth__panel,.auth__panel>*{animation:rise .6s var(--out) both}
.auth__panel{max-width:380px;width:100%;padding:28px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,var(--surface),var(--bg-2));box-shadow:var(--sh-2),inset 0 1px 0 var(--hi);animation-delay:.08s}
.auth__panel>:nth-child(1){animation-delay:.14s}.auth__panel>:nth-child(2){animation-delay:.2s}.auth__panel>:nth-child(3){animation-delay:.26s}
.auth__title{font-size:1.25rem;margin-bottom:20px}
.tagline{margin:10px 0 0;color:var(--tx-2);font-size:1.0625rem;max-width:26ch}
.auth__foot{margin:18px 0 0;color:var(--tx-2);font-size:.8125rem;line-height:1.5}
@media (min-width:768px){.auth{grid-template-columns:1fr 380px;align-items:center;gap:72px}.wordmark{font-size:3.75rem}}
@media (max-width:480px){.auth__panel{padding:22px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
.field{display:grid;gap:7px}
.field__label{font-size:.75rem;font-weight:600;color:var(--tx-2);letter-spacing:.01em}
</style>
</head>
<body>
<div class="splash" id="splash"><i></i></div>
<a class="ext" href="https://example.com" target="_blank" rel="noopener noreferrer" aria-label="Open example.com in a new tab" title="example.com"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
<main class="auth" id="auth" hidden>
  <header><h1 class="wordmark">Orbit</h1><p class="tagline">Conversations in their natural orbit.</p></header>
  <div class="auth__panel" id="panel"></div>
</main>
<noscript><p>Orbit needs JavaScript to run.</p></noscript>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, onAuthStateChanged, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
// ── Fill these in from Firebase console → Project settings → Your apps (same values in main.html) ──
const firebaseConfig = {
  apiKey: 'AIzaSyAk7xXeYefjx64sLUX0wVe7wDTyRvpvb08',
  authDomain: 'orbit-xyz.firebaseapp.com',
  databaseURL: 'https://orbit-xyz-default-rtdb.firebaseio.com',
  projectId: 'orbit-xyz',
  appId: '1:610426346586:web:e4220f3d4457b3445b4c63'
};
const app = initializeApp(firebaseConfig), auth = initializeAuth(app, { persistence: [indexedDBLocalPersistence, browserLocalPersistence] });

try {
  const t = localStorage.getItem('orbit.theme') || 'dark';
  document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
} catch { /* storage blocked: stay dark */ }

const panel = document.getElementById('panel');
const go = () => location.replace('main.html');
let mode = 'in', busy = false;

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  n.append(...kids.flat().filter((x) => x != null));
  return n;
}

const ERR = {
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/invalid-email': 'That email address does not look right.',
  'auth/email-already-in-use': 'An account with that email already exists.',
  'auth/weak-password': 'Choose a stronger password.',
  'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
  'auth/network-request-failed': 'No connection. Check your network.'
};
const friendly = (e) => (e.code ? ERR[e.code] || 'Something went wrong. Try again.' : e.message);

const FIELDS = {
  email: ['Email', 'email', { autocomplete: 'email', inputmode: 'email' }],
  password: ['Password', 'password', {}]
};
const field = (k) => {
  const [label, type, extra] = FIELDS[k];
  const pw = k === 'password' ? { autocomplete: 'current-password' } : {};
  return el('label', { class: 'field', for: k },
    el('span', { class: 'field__label', text: label }),
    el('input', { id: k, name: k, type, class: 'input', required: true, ...extra, ...pw }));
};

const MODES = {
  in: {
    title: 'Sign in', cta: 'Sign in', fields: ['email', 'password'],
    run: async (d) => {
      await signInWithEmailAndPassword(auth, d.email.trim(), d.password);
      try { sessionStorage.removeItem('orbit.unlocked'); localStorage.setItem('orbit.hint', '1'); } catch { /* storage blocked */ }
      go();
    },
    foot: () => [el('span', { text: 'Accounts are created by the administrator.' })]
  }
};

function render() {
  const m = MODES[mode];
  const msg = el('p', { class: 'form-msg form-error', role: 'alert' });
  const btn = el('button', { class: 'btn btn--primary', type: 'submit', text: m.cta });
  const form = el('form', {
    class: 'form',
    onsubmit: async (e) => {
      e.preventDefault();
      msg.className = 'form-msg form-error'; msg.textContent = '';
      btn.disabled = true; busy = true;
      try { await m.run(Object.fromEntries(new FormData(form)), msg); }
      catch (x) { msg.textContent = friendly(x); }
      finally { busy = false; btn.disabled = false; }
    }
  }, ...m.fields.map(field), msg, btn);
  panel.replaceChildren(el('h2', { class: 'auth__title', text: m.title }), form, el('p', { class: 'auth__foot' }, ...m.foot()));
}

const hint = (() => { try { return localStorage.getItem('orbit.hint') === '1'; } catch { return false; } })();
const show = () => {
  document.getElementById('splash')?.remove();
  document.getElementById('auth').hidden = false;
  if (!panel.firstChild) render();
};
if (!hint) show();   // nobody is remembered on this device: paint the form without waiting for auth
onAuthStateChanged(auth, (u) => {
  if (u && !busy) { try { localStorage.setItem('orbit.hint', '1'); } catch { /* storage blocked */ } return go(); }
  if (!u) { try { localStorage.removeItem('orbit.hint'); } catch { /* storage blocked */ } show(); }
});
// While you type your login, warm the chat page's heavier files in the background.
setTimeout(() => {
  const add = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.append(l); };
  add('modulepreload', 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');
  add('prefetch', 'main.html');
}, 800);
</script>
</body>
</html>
