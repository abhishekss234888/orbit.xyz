<!doctype html>
<html lang="en" data-theme="dark">
<head>
<title>Orbit · Sign in</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Conversations in their natural orbit.">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E0F11">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Schibsted+Grotesk:wght@600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&family=Schibsted+Grotesk:wght@600;700&display=swap"></noscript>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js">
<link rel="prefetch" href="main.html">

<style>:root,[data-theme="dark"]{--bg:#0E0F11;--bg-elevated:#15171A;--surface:#1A1D21;--surface-hover:#212529;--border:#262A2F;--border-strong:#353A41;--text-primary:#ECEAE6;--text-secondary:#A9A7A1;--text-muted:#8A8B84;--text-inverse:#17120B;--accent:#F2A65A;--accent-hover:#F5B676;--accent-pressed:#D98F43;--accent-subtle:#F2A65A24;--online:#5BD28A;--danger:#F0645B;--danger-subtle:#F0645B22}
[data-theme="light"]{--bg:#F6F3EE;--bg-elevated:#FBF9F5;--surface:#FBF9F5;--surface-hover:#EFEBE4;--border:#E3DED5;--border-strong:#CFC8BC;--text-primary:#1B1A17;--text-secondary:#55524B;--text-muted:#7A766D;--text-inverse:#FFF8EE;--accent:#B5600C;--accent-hover:#9F5409;--accent-pressed:#8A4807;--accent-subtle:#B5600C1A;--online:#1E9E5A;--danger:#C93C33;--danger-subtle:#C93C331A}
:root{--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;--sp-8:32px;--sp-12:48px;--r-2:12px;--r-pill:999px;--font-ui:'Schibsted Grotesk',system-ui,sans-serif;--font-body:'Hanken Grotesk',system-ui,sans-serif;--ease-out:cubic-bezier(0.16,1,0.3,1);--ease-tap:cubic-bezier(0.2,0,0,1);--ease-std:cubic-bezier(0.4,0,0.2,1);--font-scale:1}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:calc(100% * var(--font-scale))}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text-primary);font:400 .875rem/1.5 var(--font-body);-webkit-font-smoothing:antialiased}
h1,h2{margin:0;font-family:var(--font-ui);font-weight:600}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.splash{position:fixed;inset:0;display:grid;place-items:center}
.splash i{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.8);opacity:.35}}
.auth{min-height:100dvh;display:grid;align-content:center;gap:var(--sp-12);padding:var(--sp-6);max-width:1000px;margin:0 auto;animation:rise 320ms var(--ease-out)}
@keyframes rise{from{transform:translateY(8px);opacity:0}}
.wordmark{font-size:1.75rem;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.tagline{margin:var(--sp-2) 0 0;color:var(--text-secondary);font-size:1rem}
.auth__panel{max-width:360px;width:100%}
.auth__title{font-size:1.25rem;letter-spacing:-.01em;margin-bottom:var(--sp-5)}
.form{display:grid;gap:var(--sp-4)}
.field{display:grid;gap:6px}
.field__label{font-size:.75rem;color:var(--text-secondary);font-weight:500}
.input{width:100%;min-height:44px;padding:0 var(--sp-3);background:var(--surface);border:1px solid var(--border);border-radius:var(--r-2);font-size:1rem;transition:border-color 140ms var(--ease-std)}
.input:hover{border-color:var(--border-strong)}
.input:focus{outline:none;border-color:var(--accent)}
.form-msg{margin:0;min-height:1.2em;font-size:.8125rem}
.form-error{color:var(--danger)}
.form-ok{color:var(--online)}
.btn{min-height:44px;padding:0 var(--sp-5);border:1px solid var(--border-strong);border-radius:var(--r-2);background:transparent;cursor:pointer;font:600 .875rem var(--font-ui);transition:transform 120ms var(--ease-tap),background 140ms var(--ease-std)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5;cursor:default}
.btn--primary{background:var(--accent);border-color:transparent;color:var(--text-inverse)}
.btn--primary:hover:not(:disabled){background:var(--accent-hover)}
.btn--primary:active:not(:disabled){background:var(--accent-pressed)}
.link{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:500}
.link:hover{text-decoration:underline}
.auth__foot{margin-top:var(--sp-5);color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:6px 10px}
@media (min-width:768px){.auth{grid-template-columns:1fr 360px;align-items:center;gap:var(--sp-12)}.wordmark{font-size:3.5rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.ext{position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:70;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--border-strong);color:var(--text-secondary);opacity:.92;text-decoration:none;touch-action:manipulation;transition:transform 120ms var(--ease-tap),color 140ms var(--ease-std),border-color 140ms var(--ease-std)}
.ext:hover{color:var(--accent);border-color:var(--accent);opacity:1}.ext:active{transform:scale(.94)}
html{-webkit-tap-highlight-color:transparent}a,button{touch-action:manipulation}
</style>
</head>
<body>
<div class="splash" id="splash"><i></i></div>
<a class="ext" href="https://example.com" target="_blank" rel="noopener noreferrer" aria-label="Open example.com in a new tab" title="example.com"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg></a>
<main class="auth" id="auth" hidden>
  <header><h1 class="wordmark">Orbit</h1><p class="tagline">Conversations in their natural orbit.</p></header>
  <div class="auth__panel" id="panel"></div>
</main>
<noscript><p style="padding:24px">Orbit needs JavaScript to run.</p></noscript>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
// ── Fill these in from Firebase console → Project settings → Your apps (same values in main.html) ──
const firebaseConfig = {
  apiKey: 'AIzaSyAk7xXeYefjx64sLUX0wVe7wDTyRvpvb08',
  authDomain: 'orbit-xyz.firebaseapp.com',
  databaseURL: 'https://orbit-xyz-default-rtdb.firebaseio.com',
  projectId: 'orbit-xyz',
  appId: '1:610426346586:web:e4220f3d4457b3445b4c63'
};
const app = initializeApp(firebaseConfig), auth = getAuth(app);

try {
  const t = localStorage.getItem('orbit.theme') || 'dark';
  document.documentElement.dataset.theme = t === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : t;
} catch { /* storage blocked: stay dark */ }

const panel = document.getElementById('panel');
const go = () => location.replace('main.html');
let mode = 'in', busy = false;

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'class') n.className = v;
    else if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v === true ? '' : v);
  }
  n.append(...kids.flat().filter((x) => x != null));
  return n;
}

const ERR = {
  'auth/invalid-credential': 'Wrong email or password.',
  'auth/invalid-email': 'That email address does not look right.',
  'auth/email-already-in-use': 'An account with that email already exists.',
  'auth/weak-password': 'Choose a stronger password.',
  'auth/too-many-requests': 'Too many attempts. Wait a minute and try again.',
  'auth/network-request-failed': 'No connection. Check your network.'
};
const friendly = (e) => (e.code ? ERR[e.code] || 'Something went wrong. Try again.' : e.message);

const FIELDS = {
  email: ['Email', 'email', { autocomplete: 'email', inputmode: 'email' }],
  password: ['Password', 'password', {}]
};
const field = (k) => {
  const [label, type, extra] = FIELDS[k];
  const pw = k === 'password' ? { autocomplete: 'current-password' } : {};
  return el('label', { class: 'field', for: k },
    el('span', { class: 'field__label', text: label }),
    el('input', { id: k, name: k, type, class: 'input', required: true, ...extra, ...pw }));
};
const link = (text, to) => el('button', { class: 'link', type: 'button', text, onclick: () => { mode = to; render(); } });

const MODES = {
  in: {
    title: 'Sign in', cta: 'Sign in', fields: ['email', 'password'],
    run: async (d) => {
      await signInWithEmailAndPassword(auth, d.email.trim(), d.password);
      try { sessionStorage.removeItem('orbit.unlocked'); } catch { /* storage blocked */ }
      go();
    },
    foot: () => [link('Forgot password', 'reset'), el('span', { text: 'Accounts are created by the administrator.' })]
  },
  reset: {
    title: 'Reset password', cta: 'Send reset link', fields: ['email'],
    run: async (d, msg) => {
      await sendPasswordResetEmail(auth, d.email.trim());
      msg.className = 'form-msg form-ok';
      msg.textContent = 'If an account exists for that email, a reset link is on its way.';
    },
    foot: () => [link('Back to sign in', 'in')]
  }
};

function render() {
  const m = MODES[mode];
  const msg = el('p', { class: 'form-msg form-error', role: 'alert' });
  const btn = el('button', { class: 'btn btn--primary', type: 'submit', text: m.cta });
  const form = el('form', {
    class: 'form',
    onsubmit: async (e) => {
      e.preventDefault();
      msg.className = 'form-msg form-error'; msg.textContent = '';
      btn.disabled = true; busy = true;
      try { await m.run(Object.fromEntries(new FormData(form)), msg); }
      catch (x) { msg.textContent = friendly(x); }
      finally { busy = false; btn.disabled = false; }
    }
  }, ...m.fields.map(field), msg, btn);
  panel.replaceChildren(el('h2', { class: 'auth__title', text: m.title }), form, el('p', { class: 'auth__foot' }, ...m.foot()));
}

// Already signed in? Skip straight to the chat page. Ignore auth events while a submit is in flight
// so sign-up can finish creating the profile before we leave.
onAuthStateChanged(auth, (u) => {
  if (u && !busy) return go();
  document.getElementById('splash')?.remove();
  document.getElementById('auth').hidden = false;
  if (!panel.firstChild) render();
});
</script>
</body>
</html>
